spring.application.name=biblioteca
server.port=8080

# PostgreSQL (cambia usuario y contraseña por los tuyos)
spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Las tablas las crea schema.sql; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# JWT (el secret debe tener 32 caracteres o más)
jwt.secret=clave-secreta-biblioteca-universitaria-2026-jwt
jwt.expiration-ms=7200000